[project]
name = "unlimitedediting-comfy-audio-utils"
description = "UnlimitedEditing fork of comfy-audio-duration, with LoadAudioAny added. ComfyUI audio utility nodes: duration inspection, silence padding, and URL-or-local audio loading for AUDIO inputs."
version = "1.1.0"
license = { file = "LICENSE" }
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = [
    "numpy",
    "scipy",
]

[project.urls]
Repository = "https://github.com/UnlimitedEditing/comfy-audio-duration"
"Original Upstream" = "https://github.com/scofano/comfy-audio-duration"
"Bug Tracker" = "https://github.com/UnlimitedEditing/comfy-audio-duration/issues"

# NOTE: the [tool.comfy] Comfy Registry publishing block (PublisherId "dansco",
# package "comfy-audio-duration") was intentionally removed. Graydient jobs on two
# separate, freshly-registered workflow slugs both failed with
# "Node 'Load Audio Any' not found" despite the node being present and verified live on
# this fork's main branch -- ruling out simple per-machine stale-checkout caching (the
# documented fresh-slug workaround didn't help). Leading suspect: ComfyUI-Manager
# resolving this package by registry identity (name+PublisherId) rather than literally
# git-cloning the `requirements.github` URL, landing back on the original
# dansco/comfy-audio-duration registry entry instead of this fork. Renaming the package
# and dropping the registry-publishing block breaks that possible identity match.